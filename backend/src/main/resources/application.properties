# ── Serveur ──────────────────────────────────────────────
server.port=8080

# ── Base de données PostgreSQL ────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/proxymedoc
spring.datasource.username=postgres
spring.datasource.password=nsangou.2006
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────
# Génère une clé secrète forte (min 256 bits) avant de déployer !
app.jwt.secret=proxymedoc_secret_key_change_me_in_production_very_long
app.jwt.expiration-ms=86400000

# ── CORS ──────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# ── Logs ──────────────────────────────────────────────────
logging.level.cm.proxymedoc=DEBUG
logging.level.org.springframework.security=INFO
